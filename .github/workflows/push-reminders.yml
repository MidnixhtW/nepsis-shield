name: Send prayer reminders

# Every 15 minutes, ask the site to send the prayer reminders that are due (see api/push-send.ts).
# GitHub may start scheduled runs a few minutes late; the sender allows for that.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# id-token: write lets the job get a signed GitHub ID token; the site checks it (api/_lib/githubOidc.ts).
permissions:
  id-token: write

concurrency:
  group: push-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send due reminders
        run: |
          TOKEN=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://www.nepsisshield.com/api/push-send" | jq -r .value)
          curl --fail-with-body --silent --show-error --max-time 90 -X POST \
            -H "Authorization: Bearer $TOKEN" \
            "https://www.nepsisshield.com/api/push-send"
