name: Announce new version

# Sends "Nepsis Shield has been updated" to everyone with notifications on. Runs when a GitHub release is published,
# or by hand from the Actions tab. Not on every push, so people are not notified for small fixes.
on:
  release:
    types: [published]
  workflow_dispatch:

# id-token: write lets the job get a signed GitHub ID token; the site checks it (api/_lib/githubOidc.ts).
permissions:
  id-token: write

jobs:
  announce:
    # The rolling Android beta is a prerelease and is republished often; only real releases are announced.
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send update notice
        run: |
          TOKEN=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://www.nepsisshield.com/api/push-send" | jq -r .value)
          curl --fail-with-body --silent --show-error --max-time 90 -X POST \
            -H "Authorization: Bearer $TOKEN" \
            "https://www.nepsisshield.com/api/push-send?kind=update"
